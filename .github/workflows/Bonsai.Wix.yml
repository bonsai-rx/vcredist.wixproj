name: Bonsai.Wix
on:
  push:
    branches: ['**']
  pull_request:
  release:
    types: [published]
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  ContinuousIntegrationBuild: true
jobs:
  pack:
    name: Pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Configure build
        id: configure-build
        uses: bonsai-rx/configure-build@v3

      - name: Pack
        id: pack
        run: dotnet pack --configuration release

      - name: Collect NuGet packages
        uses: actions/upload-artifact@v7
        if: steps.pack.outcome == 'success' && always()
        with:
          name: Packages
          if-no-files-found: error
          path: artifacts/package/release/**

  test:
    name: Test
    runs-on: windows-latest
    needs: pack
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v4

      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          name: Packages
          path: artifacts/package/release

      - name: Install WiX
        run: nuget install WiX -Version 3.14.1 -ExcludeVersion -OutputDirectory artifacts/tests/tools -NonInteractive

      - name: Install built package
        run: nuget install Bonsai.Wix.vc143.redist -Prerelease -ExcludeVersion -Source ${{github.workspace}}/artifacts/package/release -OutputDirectory artifacts/tests/packages -NonInteractive

      - name: Build test bundle
        run: msbuild tests/Bundle/Bundle.wixproj -nologo

  publish-packages-nuget-org:
    name: Publish packages to NuGet.org
    runs-on: ubuntu-latest
    environment: public-release
    needs: [pack, test]
    if: github.event_name == 'release'
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          name: Packages
          path: artifacts/packages/

      - name: Upload release assets
        run: gh release upload --repo ${{github.repository}} ${{github.event.release.tag_name}} artifacts/packages/* --clobber
        env:
          GH_TOKEN: ${{github.token}}

      - name: Log in to NuGet.org with OIDC
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{secrets.NUGET_USER}}

      - name: Push to NuGet.org
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key ${{steps.nuget-login.outputs.NUGET_API_KEY}} --source ${{vars.NUGET_API_URL}}
